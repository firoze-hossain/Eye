# src/main/resources/application-dev.yml
# Local / LAN development profile.
spring:
  datasource:
    url: jdbc:h2:file:./data/trackeye_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      # allow reaching the console from other machines on the LAN while testing
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # In DEV, let Hibernate build the schema from the @Entity classes.
      ddl-auto: update
    show-sql: false
    open-in-view: false

  # IMPORTANT: Flyway is disabled in dev because the V1 migration is written for
  # PostgreSQL/production. In dev, Hibernate (ddl-auto: update) creates the tables.
  # Flyway stays ON in the prod profile.
  flyway:
    enabled: false

  mvc:
    throw-exception-if-no-handler-found: true

  # Screenshot uploads are multipart. Spring's DEFAULT cap is 1MB, and a
  # full-screen Retina JPEG is 2-5MB, so every upload was rejected before this.
  # NOTE: trackeye.storage.max-file-size does NOT control this - only these do.
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080
  # Bind to all interfaces so employee PCs on your LAN can reach the server at
  # http://<this-server-ip>:8080
  address: 0.0.0.0

# File storage for screenshots
trackeye:
  storage:
    screenshots: ./data/screenshots
    max-file-size: 10MB
    allowed-formats: jpg,jpeg,png

  security:
    # These filters now always enforce auth on their own paths, so this flag is
    # informational. Keep real secrets out of source control via env vars.
    enabled: true
    api-key-header: X-API-Key
    device-id-header: X-Device-ID
    api-key-validity-days: 365
    jwt-secret: ${JWT_SECRET:dev-only-change-this-to-a-long-random-string}
    encryption-key: ${ENCRYPTION_KEY:dev-only-encryption-key-change-me}
    token-validity-hours: 12

  rate-limiting:
    enabled: true
    requests-per-minute: 600
    burst-capacity: 1000

  registration:
    require-approval: false
    default-role: employee
    invite-expiry-hours: 48

logging:
  level:
    com.roze.trackeyecentral: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  base-url: http://localhost:8080
  # Origins allowed to call the API from a browser (the Next.js dashboard).
  # Add your LAN address here too, comma-separated, e.g.
  #   http://localhost:3000,http://192.168.1.50:3000
  frontend-origins: http://localhost:3000