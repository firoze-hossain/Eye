<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrackEye — Connect this computer</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #3b82f6;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; margin-bottom: 18px;
    background: #0f1218; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 18px; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.ok  { display: block; background: rgba(34,197,94,.12);  border: 1px solid rgba(34,197,94,.35);  color: #86efac; }
  .msg.err { display: block; background: rgba(239,68,68,.12);  border: 1px solid rgba(239,68,68,.35);  color: #fca5a5; word-break: break-word; }
  .status {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px; padding: 11px 13px;
    background: #0f1218; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on  { background: var(--ok); }
  .dot.off { background: var(--err); }
  .hint { margin-top: 22px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>Connect this computer</h1>
  <p class="sub">Link this machine to your TrackEye organization.</p>

  <div class="status" style="flex-direction: column; align-items: flex-start; gap: 6px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking status…</span>
    </div>
    <div id="detailText" style="font-size:12px; color:var(--muted); padding-left:16px;"></div>
  </div>

  <div id="form">
    <label for="serverUrl">Server address</label>
    <input id="serverUrl" type="text" placeholder="http://192.168.1.50:8080" />

    <label for="email">Your work email</label>
    <input id="email" type="email" placeholder="you@company.com" autocomplete="email" />

    <label for="token">Registration token</label>
    <input id="token" type="text" placeholder="Paste the token from your admin" />

    <button id="submit">Connect</button>
  </div>

  <div class="msg" id="msg"></div>

  <p class="hint">
    Your administrator generates a registration token for you. Once connected,
    this computer syncs activity automatically — you don't need to open this page again.
  </p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), statusText = $('statusText'), detailText = $('detailText'), msg = $('msg'), form = $('form');
  const serverUrlInput = $('serverUrl');
  let serverUrlEditedByUser = false;
  serverUrlInput.addEventListener('input', () => { serverUrlEditedByUser = true; });

  function setMsg(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  function timeAgo(ts) {
    if (!ts) return 'never';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    return Math.floor(s / 3600) + 'h ago';
  }

  function showRegistered() {
    form.style.display = 'none';
  }

  async function checkStatus() {
    try {
      const r = await fetch('/api/setup/status');
      const d = await r.json();

      if (!serverUrlEditedByUser && d.serverUrl && !serverUrlInput.value) {
        serverUrlInput.value = d.serverUrl;
      }

      if (!d.registered) {
        dot.className = 'dot off';
        form.style.display = ''; // re-show: registration may have just been invalidated
        if (d.lastError && d.lastError.length > 0) {
          statusText.textContent = 'Registration was cleared by the server';
          detailText.textContent = d.lastError + ' — enter a fresh token below.';
        } else {
          statusText.textContent = 'Not connected';
          detailText.textContent = '';
        }
        return;
      }
      showRegistered();

      // This is the truthful part: registration alone does NOT mean sync is
      // working. We show the real last-success time and any real error.
      const hasSynced = d.lastSuccessAt > 0;
      const recentError = d.lastError && d.lastError.length > 0;
      const isPaused = d.lastError && d.lastError.indexOf('Paused by admin') !== -1;

      if (isPaused) {
        dot.className = 'dot';
        statusText.textContent = 'Paused by admin';
        detailText.textContent = 'This device will resume syncing automatically once un-paused - ' +
                d.unsyncedRows + ' row(s) queued locally in the meantime.';
      } else if (recentError && (!hasSynced || d.lastAttemptAt > d.lastSuccessAt)) {
        dot.className = 'dot off';
        statusText.textContent = 'Connected, but syncing is failing';
        detailText.textContent = 'Last error: ' + d.lastError + ' · ' + d.unsyncedRows + ' rows waiting to upload';
      } else if (hasSynced) {
        dot.className = 'dot on';
        statusText.textContent = 'Connected — last synced ' + timeAgo(d.lastSuccessAt);
        detailText.textContent = d.unsyncedRows + ' row(s) waiting to upload';
      } else {
        dot.className = 'dot';
        statusText.textContent = 'Connected — waiting for first sync…';
        detailText.textContent = d.unsyncedRows + ' row(s) queued locally';
      }
    } catch {
      dot.className = 'dot off';
      statusText.textContent = 'Agent not reachable';
      detailText.textContent = '';
    }
  }

  $('submit').addEventListener('click', async () => {
    const serverUrl = serverUrlInput.value.trim();
    const email = $('email').value.trim();
    const registrationToken = $('token').value.trim();

    if (!serverUrl || !email || !registrationToken) {
      setMsg('Enter the server address, your email, and the registration token.', 'err');
      return;
    }

    const btn = $('submit');
    btn.disabled = true;
    btn.textContent = 'Connecting…';
    msg.className = 'msg';

    try {
      // Save the server address first - registration below will fail with a
      // ConnectException if this points somewhere unreachable, and that's a
      // much clearer failure than silently registering against the wrong host.
      const urlResp = await fetch('/api/setup/server-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ serverUrl })
      });
      if (!urlResp.ok) {
        setMsg('Could not save the server address.', 'err');
        return;
      }

      const r = await fetch('/api/setup/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, registrationToken })
      });
      const d = await r.json();

      if (d.success) {
        setMsg('Connected. This computer is now syncing.', 'ok');
        showRegistered();
      } else {
        setMsg(d.message || 'Registration failed.', 'err');
      }
    } catch (e) {
      setMsg('Could not reach the agent: ' + e.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  });

  // Allow Enter to submit
  ['serverUrl', 'email', 'token'].forEach(id =>
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('submit').click(); })
  );

  checkStatus();
  setInterval(checkStatus, 5000);
</script>
</body>
</html>
