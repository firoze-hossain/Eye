#server.port=8765
#spring.application.name=TrackEye
#trackeye.server.url=http://localhost:8080
#
## Storage Configuration
#trackeye.storage-path=${user.home}/TrackEyeData
#
## Tracking Configuration (milliseconds)
#trackeye.idle-timeout-seconds=180
#trackeye.poll-interval-ms=1000
#
## Screenshot Configuration
#trackeye.screenshot-interval-seconds=300
#trackeye.screenshot-on-app-switch=true
#
## Browser Tracking
#trackeye.browser-tracking-enabled=true
#trackeye.browser-poll-interval-ms=2000
#
## Logging
#logging.level.com.roze=INFO
#logging.level.com.roze.platform=DEBUG
#logging.file.path=${trackeye.storage-path}/logs
#
## Linux Specific
#spring.main.web-application-type=servlet
#server.error.include-message=always


server.port=8765
spring.application.name=TrackEye

# ====== CENTRAL SERVER ======
# Point this at the machine running trackeye-central.
# On the SAME PC while testing you can use localhost.
# On your LAN, use the server PC's IP, e.g. http://192.168.1.50:8080
# (find it with `ip addr` on Linux/Mac or `ipconfig` on Windows)
trackeye.server.url=http://localhost:8080

# Storage Configuration
trackeye.storage-path=${user.home}/TrackEyeData

# Tracking Configuration
trackeye.idle-timeout-seconds=180
trackeye.poll-interval-ms=1000

# Screenshot Configuration
trackeye.screenshot-interval-seconds=300
trackeye.screenshot-on-app-switch=true

# Browser Tracking
trackeye.browser-tracking-enabled=true
trackeye.browser-poll-interval-ms=2000

# Logging
logging.level.com.roze=INFO
logging.level.com.roze.platform=DEBUG
logging.file.path=${trackeye.storage-path}/logs

# Linux Specific
spring.main.web-application-type=servlet
server.error.include-message=always

# Allow the local dashboard (if any) to be reached from the LAN too.
# Bind to all interfaces so http://<this-pc-ip>:8765 works.
server.address=0.0.0.0